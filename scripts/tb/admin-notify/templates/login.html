<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><title>Connexion · Notif TDUO</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:-apple-system,Segoe UI,sans-serif;background:#f6f7f9;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#222}
  .card{background:#fff;padding:32px 36px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);width:100%;max-width:360px}
  h1{margin:0 0 18px;font-size:18px;font-weight:600}
  label{display:block;font-size:13px;color:#555;margin:14px 0 4px}
  input{width:100%;padding:9px 11px;border:1px solid #d8dadd;border-radius:6px;font-size:14px;box-sizing:border-box}
  input:focus{outline:none;border-color:#1976d2}
  button{margin-top:20px;width:100%;background:#1976d2;color:#fff;border:0;padding:10px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
  button:hover{background:#1565c0}
  .err{background:#ffebee;color:#c62828;padding:9px 12px;border-radius:6px;font-size:13px;margin-bottom:8px}
  .hint{margin-top:14px;font-size:12px;color:#888;text-align:center}
</style></head><body>
<form class="card" method="post" action="{{ root }}/login">
  <h1>Notifications TDUO — connexion</h1>
  {% if error == 'invalid' %}<div class="err">Identifiants incorrects.</div>{% endif %}
  {% if error == 'forbidden' %}<div class="err">Compte non autorisé (TENANT_ADMIN requis).</div>{% endif %}
  {% if error == 'tb_unreachable' %}<div class="err">ThingsBoard injoignable.</div>{% endif %}
  <label>Email</label><input name="username" type="email" required autofocus>
  <label>Mot de passe</label><input name="password" type="password" required>
  <button type="submit">Se connecter</button>
  <div class="hint">Compte ThingsBoard tenant admin yahtec</div>
</form>
</body></html>
