<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><title>Notifications TDUO</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:-apple-system,Segoe UI,sans-serif;background:#f6f7f9;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px}
  .box{text-align:center;padding:24px}
  .spinner{width:24px;height:24px;border:3px solid #e0e3e6;border-top-color:#1976d2;border-radius:50%;animation:s 0.8s linear infinite;margin:0 auto 12px}
  @keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<div class="box">
  <div class="spinner"></div>
  <div id="msg">Connexion…</div>
</div>
<script>
(function(){
  function fallback(){ window.location.replace('{{ root }}/login'); }
  var tok = null;
  try { tok = localStorage.getItem('jwt_token'); } catch(_){}
  if (!tok) return fallback();
  fetch('{{ root }}/login-jwt', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify({ token: tok })
  }).then(function(r){
    if (r.ok) {
      window.location.replace('{{ root }}/');
    } else {
      fallback();
    }
  }).catch(fallback);
})();
</script>
</body></html>
