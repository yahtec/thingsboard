<?xml version="1.0" encoding="UTF-8"?>
<!--
  Yahtec / TSmart logo - LIGHT background variant (flamme rouge marque + wordmark foncé). Pour le login / fonds clairs.
  - Flame mark sourced from https://bootloader.tsmart.fr/tsmart/portal/assets/brand/flame.png
    (publicly served alongside the Terris portal).
  - The source PNG is red on a transparent background. We apply a feColorMatrix
    filter that forces every opaque pixel to white while preserving the alpha
    channel — this guarantees readability against any dark/red toolbar background
    without modifying the upstream raster asset.
  - Wordmark "TSmart" set in Montserrat 700, white, wide tracking.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 360 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="flame-to-red" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.788
                                           0 0 0 0 0.161
                                           0 0 0 0 0.161
                                           0 0 0 1 0"/>
    </filter>
  </defs>
  <image x="6" y="5" width="80" height="90" preserveAspectRatio="xMidYMid meet" filter="url(#flame-to-red)" xlink:href="data:image/png;base64,"/>
  <text x="106" y="68" font-family="Montserrat, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="3" fill="#263238">TSmart</text>
</svg>
