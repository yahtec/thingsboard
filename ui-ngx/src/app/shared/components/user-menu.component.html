<section class="flex flex-row">
  <!-- Yahtec : deux rendus selon adminMode.
       adminMode=true  : rendu natif TB (avatar + nom + rôle en lecture, et un
                         bouton ⋮ séparé qui sert de trigger menu).
       adminMode=false : rendu custom TSmart (profil cliquable = trigger menu,
                         rôle masqué, pas de bouton ⋮). -->
  <ng-container *ngIf="adminMode; else customerMode">
    <div *ngIf="displayUserInfo" class="tb-user-info flex flex-row lt-lg:!hidden">
      <mat-icon class="material-icons tb-mini-avatar">account_circle</mat-icon>
      <div class="flex flex-col items-stretch justify-center">
        <span *ngIf="userDisplayName$ | async; let userDisplayName" class="tb-user-display-name">{{ userDisplayName }}</span>
        <span *ngIf="authorityName$ | async; let authorityName" class="tb-user-authority">{{ authorityName | translate }}</span>
      </div>
    </div>
    <button mat-icon-button [matMenuTriggerFor]="userMenu">
      <mat-icon class="material-icons">more_vert</mat-icon>
    </button>
  </ng-container>
  <ng-template #customerMode>
    <button *ngIf="displayUserInfo" type="button"
            class="tb-user-info flex flex-row"
            [matMenuTriggerFor]="userMenu"
            [attr.aria-label]="'home.open-user-menu' | translate">
      <mat-icon class="material-icons tb-mini-avatar">account_circle</mat-icon>
      <div class="flex flex-col items-stretch justify-center lt-lg:!hidden">
        <span *ngIf="userDisplayName$ | async; let userDisplayName" class="tb-user-display-name">{{ userDisplayName }}</span>
      </div>
    </button>
  </ng-template>
  <mat-menu #userMenu="matMenu" xPosition="before">
    <div class="tb-user-menu-items" *ngIf="authority$ | async; let authority">
      <button mat-menu-item (click)="openAccount()">
        <mat-icon class="material-icons">account_circle</mat-icon>
        <span translate>account.account</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon class="material-icons">exit_to_app</mat-icon>
        <span translate>home.logout</span>
      </button>
    </div>
  </mat-menu>
</section>
